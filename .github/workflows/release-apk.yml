name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    # Only run build if commit message contains '[release]' or 'release', or if a tag/workflow_dispatch was triggered
    if: ${{ contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, 'release') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Expo Prebuild
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        env:
          EXPO_PUBLIC_API_URL: "https://frozed.onrender.com"
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Prepare APK File
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk frozen-shake-${{ env.TAG_NAME }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: frozen-shake-${{ env.TAG_NAME }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
